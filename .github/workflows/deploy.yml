name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # GitHub OIDC → AWS role (no stored AWS keys)

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  staging:
    name: Deploy to staging
    needs: ci
    runs-on: ubuntu-24.04
    environment:
      name: staging
      url: ${{ steps.tf.outputs.api_url }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_DIR: infra/terraform/envs/staging
    steps:
      - uses: actions/checkout@v4

      - name: Check repository variables
        run: |
          for v in AWS_ROLE_ARN AWS_REGION TF_STATE_BUCKET; do
            [ -n "${!v}" ] || { echo "::error::Repository variable $v is not set (Settings → Secrets and variables → Actions → Variables)"; exit 1; }
          done
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Terraform apply (pilot server, registry, buckets, secrets)
        id: tf
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${AWS_REGION}"
          terraform apply -input=false -auto-approve -var="region=${AWS_REGION}"
          for o in instance_id host api_url ecr_repository_url deploy_bucket backup_bucket routing_bucket; do
            echo "$o=$(terraform output -raw $o)" >> "$GITHUB_OUTPUT"
          done

      - name: Build and push API image
        id: image
        run: |
          IMAGE="${{ steps.tf.outputs.ecr_repository_url }}:${GITHUB_SHA::12}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${IMAGE%%/*}"
          docker build --build-arg GIT_SHA="${GITHUB_SHA::12}" -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build the web dashboard
        run: |
          pnpm install --frozen-lockfile --filter @ragoh/web...
          pnpm --filter @ragoh/web build
          rm -rf deploy/staging/web && cp -r apps/web/dist deploy/staging/web

      - name: Upload deploy bundle
        run: aws s3 sync deploy/staging "s3://${{ steps.tf.outputs.deploy_bucket }}/bundle/" --delete

      - name: Roll out on the server (via Systems Manager)
        env:
          INSTANCE_ID: ${{ steps.tf.outputs.instance_id }}
          IMAGE: ${{ steps.image.outputs.image }}
          HOST: ${{ steps.tf.outputs.host }}
          DEPLOY_BUCKET: ${{ steps.tf.outputs.deploy_bucket }}
          BACKUP_BUCKET: ${{ steps.tf.outputs.backup_bucket }}
          ROUTING_BUCKET: ${{ steps.tf.outputs.routing_bucket }}
        run: |
          echo "Waiting for the server to register with Systems Manager..."
          for i in $(seq 1 60); do
            state=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || true)
            [ "$state" = "Online" ] && break
            sleep 10
          done
          [ "$state" = "Online" ] || { echo "::error::Server never came online in Systems Manager"; exit 1; }

          COMMANDS=$(jq -cn --arg b "$DEPLOY_BUCKET" --arg img "$IMAGE" --arg host "$HOST" \
            --arg region "$AWS_REGION" --arg bk "$BACKUP_BUCKET" --arg rb "$ROUTING_BUCKET" '{commands: [
              "for i in $(seq 1 60); do [ -f /opt/ragoh/.bootstrapped ] && break; sleep 5; done",
              "aws s3 sync s3://\($b)/bundle/ /opt/ragoh/ --region \($region) --exclude 'web/*'",
              "aws s3 sync s3://\($b)/bundle/web/ /opt/ragoh/web/ --region \($region) --delete",
              "chmod +x /opt/ragoh/deploy.sh",
              "/opt/ragoh/deploy.sh \($img) \($host) \($region) \($bk) \($rb)"
            ]}')
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "RAGOH deploy ${GITHUB_SHA::12}" \
            --timeout-seconds 900 --parameters "$COMMANDS" \
            --query Command.CommandId --output text)

          for i in $(seq 1 90); do
            status=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text | tail -n 60
          [ "$status" = "Success" ] || { echo "::error::Deploy command finished with status $status"; exit 1; }

      - name: Smoke test over HTTPS
        run: |
          URL="${{ steps.tf.outputs.api_url }}"
          for i in $(seq 1 30); do
            if curl -fsS "$URL/health" | grep -q '"ok"'; then
              echo "Staging is up: $URL"
              curl -fsS "$URL/version"; echo
              echo "### Staging deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
              curl -fsS "$URL/" | grep -q '<div id="root">' || { echo "::error::Dashboard not served at $URL/"; exit 1; }
              echo "Dashboard: $URL  ·  API docs: $URL/docs" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$URL/health did not return ok"
          exit 1

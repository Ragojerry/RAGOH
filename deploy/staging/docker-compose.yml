# Staging (pilot mode) stack, run on the single EC2 server by deploy.sh.
# Values come from /opt/ragoh/.env, written by deploy.sh from SSM Parameter Store.
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ragoh
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ragoh
    volumes:
      - /opt/ragoh/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragoh"]
      interval: 5s
      retries: 30
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb"]
    mem_limit: 96m

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    environment:
      RAGOH_ENV: staging
      RAGOH_DATABASE_URL: postgresql+psycopg://ragoh:${DB_PASSWORD}@db:5432/ragoh
      RAGOH_REDIS_URL: redis://redis:6379/0
      RAGOH_JWT_SECRET: ${JWT_SECRET}
      RAGOH_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      RAGOH_DEMO_PASSWORD: ${DEMO_PASSWORD}
      RAGOH_SEED_DEMO: "true"
      RAGOH_MEDIA_DIR: /data/media
      RAGOH_OSRM_URL: http://osrm:5000
      RAGOH_VROOM_URL: http://vroom:3000
      RAGOH_TILES_DIR: /data/tiles
    volumes:
      - /opt/ragoh/data/media:/data/media
      - /opt/ragoh/data/tiles:/data/tiles:ro
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    mem_limit: 512m

  # Walking routes on the FCT road network. Waits quietly until the routing-data workflow
  # has delivered data; the API falls back to straight-line estimates meanwhile.
  osrm:
    image: osrm/osrm-backend:v5.27.1
    restart: unless-stopped
    command:
      - sh
      - -c
      - 'if [ -f /data/fct.osrm.mldgr ]; then exec osrm-routed --algorithm mld --max-table-size 1000 /data/fct.osrm; else echo "No routing data yet"; exec sleep infinity; fi'
    volumes:
      - /opt/ragoh/data/osrm:/data:ro
    mem_limit: 384m

  # Orders a day's visits (travelling-salesman with priorities and time windows), using OSRM.
  vroom:
    image: ghcr.io/vroom-project/vroom-docker:v1.14.0
    restart: unless-stopped
    environment:
      VROOM_ROUTER: osrm
    volumes:
      - ./vroom-config.yml:/conf/config.yml:ro
    depends_on: [osrm]
    mem_limit: 192m

  # Serves the FCT vector map tiles (for online maps and phone offline downloads).
  tiles:
    image: protomaps/go-pmtiles:latest  # small, stateless tile server
    restart: unless-stopped
    command: ["serve", "/data", "--port=8080", "--cors=*"]
    volumes:
      - /opt/ragoh/data/tiles:/data:ro
    mem_limit: 96m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      RAGOH_HOST: ${RAGOH_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/ragoh/data/caddy:/data
      - /opt/ragoh/data/tiles/assets:/srv/map-assets:ro
    depends_on: [api, tiles]
    mem_limit: 128m
